<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs><style>.bg{fill:#000}.panel{fill:#111214;stroke:#2b2d31;stroke-width:2}.muted{fill:#9b9da3}.txt{fill:#f5f5f7;font-family:Arial,sans-serif}.accent{fill:#ff9500}.line{stroke:#34363b;stroke-width:4}.btn{fill:#202124}.light{fill:#fff}.darktxt{fill:#111;font-family:Arial,sans-serif}</style></defs>
<rect width="1600" height="1200" fill="#17191d"/>
<!-- Desktop dark -->
<g transform="translate(40 40)"><rect width="1520" height="520" rx="24" class="bg" stroke="#34363b" stroke-width="2"/>
<text x="56" y="62" class="txt" font-size="30" font-weight="700">Quanto <tspan fill="#ff9500">Cobro?</tspan></text>
<text x="360" y="58" class="txt" font-size="16">Como funciona</text><text x="520" y="58" class="txt" font-size="16">Metodologia</text><text x="650" y="58" class="txt" font-size="16">Dúvidas</text>
<rect x="50" y="100" width="930" height="370" rx="24" class="panel"/><rect x="1000" y="100" width="470" height="370" rx="24" class="panel"/>
<g transform="translate(100 145)"><circle cx="30" cy="20" r="18" class="accent"/><text x="25" y="26" class="darktxt" font-size="16">1</text><line x1="50" y1="20" x2="720" y2="20" class="line"/><text x="0" y="60" class="txt" font-size="14">Situação</text><text x="210" y="60" class="muted" font-family="Arial" font-size="14">Tempo</text><text x="420" y="60" class="muted" font-family="Arial" font-size="14">Valor da hora</text><text x="660" y="60" class="muted" font-family="Arial" font-size="14">Ajustes</text>
<text x="0" y="115" class="txt" font-size="34" font-weight="700">O que você precisa cobrar?</text><text x="0" y="145" class="muted" font-family="Arial" font-size="18">Escolha a situação mais próxima do seu caso.</text>
<g transform="translate(0 175)"><rect width="180" height="120" rx="22" class="accent"/><rect x="195" width="180" height="120" rx="22" class="btn"/><rect x="390" width="180" height="120" rx="22" class="btn"/><rect x="585" width="180" height="120" rx="22" class="btn"/><text x="42" y="70" class="darktxt" font-size="20" font-weight="700">Novo trabalho</text><text x="220" y="70" class="txt" font-size="18">Alteração</text><text x="430" y="70" class="txt" font-size="18">Prazo urgente</text><text x="620" y="70" class="txt" font-size="18">Projeto voltou</text></g></g>
<text x="1050" y="155" class="muted" font-family="Arial" font-size="18">Sua referência</text><text x="1050" y="225" fill="#ff9500" font-family="Arial" font-size="58" font-weight="700">R$ 1.152</text><text x="1050" y="260" class="txt" font-size="18">para este projeto</text>
<text x="1050" y="315" class="txt" font-size="17">Tempo estimado</text><text x="1390" y="315" class="txt" font-size="17">8 h</text><text x="1050" y="350" class="txt" font-size="17">Valor da sua hora</text><text x="1370" y="350" class="txt" font-size="17">R$ 120</text><text x="1050" y="385" class="txt" font-size="17">Adicional de urgência</text><text x="1390" y="385" class="txt" font-size="17">+20%</text><text x="1050" y="430" class="txt" font-size="22" font-weight="700">Total</text><text x="1350" y="430" class="txt" font-size="22" font-weight="700">R$ 1.152</text></g>
<!-- Mobile flow dark, 5 screens -->
<g transform="translate(40 610)">
<g id="phone"><rect width="270" height="540" rx="42" class="bg" stroke="#555" stroke-width="3"/><text x="24" y="45" class="txt" font-size="18" font-weight="700">Quanto <tspan fill="#ff9500">Cobro?</tspan></text></g>
<use href="#phone" x="0"/><use href="#phone" x="300"/><use href="#phone" x="600"/><use href="#phone" x="900"/><use href="#phone" x="1200"/>
<!-- screen 1 --> <g><text x="25" y="100" class="txt" font-size="24" font-weight="700">O que você precisa</text><text x="25" y="130" class="txt" font-size="24" font-weight="700">cobrar?</text><rect x="25" y="170" width="105" height="105" rx="52" class="accent"/><rect x="140" y="170" width="105" height="105" rx="52" class="btn"/><rect x="25" y="285" width="105" height="105" rx="52" class="btn"/><rect x="140" y="285" width="105" height="105" rx="52" class="btn"/><text x="43" y="230" class="darktxt" font-size="15">Novo trabalho</text><text x="158" y="230" class="txt" font-size="14">Alteração</text><text x="43" y="345" class="txt" font-size="14">Urgente</text><text x="155" y="345" class="txt" font-size="14">Voltou</text></g>
<!-- screen2 --> <g transform="translate(300)"><text x="25" y="105" class="txt" font-size="23" font-weight="700">Quanto tempo vai levar?</text><rect x="25" y="145" width="220" height="85" rx="22" class="panel"/><text x="95" y="205" class="txt" font-size="46" font-weight="700">8 h</text><g transform="translate(25 250)"><circle cx="35" cy="35" r="35" class="btn"/><circle cx="110" cy="35" r="35" class="btn"/><circle cx="185" cy="35" r="35" class="accent"/><text x="30" y="43" class="txt" font-size="20">2</text><text x="105" y="43" class="txt" font-size="20">4</text><text x="180" y="43" class="darktxt" font-size="20">8</text></g><rect x="25" y="420" width="220" height="58" rx="28" class="accent"/><text x="95" y="457" class="darktxt" font-size="18" font-weight="700">Continuar</text></g>
<!-- screen3 --> <g transform="translate(600)"><text x="25" y="105" class="txt" font-size="23" font-weight="700">Qual é o valor da</text><text x="25" y="132" class="txt" font-size="23" font-weight="700">sua hora?</text><rect x="25" y="155" width="220" height="80" rx="22" class="panel"/><text x="55" y="210" class="txt" font-size="40" font-weight="700">R$ 120</text><g transform="translate(35 255)"><circle cx="30" cy="30" r="30" class="btn"/><circle cx="100" cy="30" r="30" class="btn"/><circle cx="170" cy="30" r="30" class="btn"/><circle cx="30" cy="100" r="30" class="btn"/><circle cx="100" cy="100" r="30" class="btn"/><circle cx="170" cy="100" r="30" class="btn"/><text x="25" y="37" class="txt" font-size="18">1</text><text x="95" y="37" class="txt" font-size="18">2</text><text x="165" y="37" class="txt" font-size="18">3</text><text x="25" y="107" class="txt" font-size="18">4</text><text x="95" y="107" class="txt" font-size="18">5</text><text x="165" y="107" class="txt" font-size="18">6</text></g><rect x="25" y="420" width="220" height="58" rx="28" class="accent"/><text x="95" y="457" class="darktxt" font-size="18" font-weight="700">Continuar</text></g>
<!-- screen4 --> <g transform="translate(900)"><text x="25" y="105" class="txt" font-size="23" font-weight="700">Há urgência</text><text x="25" y="132" class="txt" font-size="23" font-weight="700">nesse projeto?</text><rect x="25" y="160" width="220" height="90" rx="22" class="panel"/><text x="75" y="220" class="txt" font-size="42" font-weight="700"><tspan fill="#ff9500">+</tspan> 20%</text><circle cx="55" cy="310" r="35" class="btn"/><circle cx="135" cy="310" r="35" class="accent"/><circle cx="215" cy="310" r="35" class="btn"/><text x="42" y="317" class="txt" font-size="16">0%</text><text x="119" y="317" class="darktxt" font-size="16">20%</text><text x="198" y="317" class="txt" font-size="16">30%</text><rect x="25" y="420" width="220" height="58" rx="28" class="accent"/><text x="100" y="457" class="darktxt" font-size="18" font-weight="700">Calcular</text></g>
<!-- result --> <g transform="translate(1200)"><text x="80" y="115" class="muted" font-family="Arial" font-size="16">Sua referência</text><text x="35" y="185" fill="#ff9500" font-family="Arial" font-size="48" font-weight="700">R$ 1.152</text><rect x="25" y="220" width="220" height="180" rx="22" class="panel"/><text x="40" y="255" class="txt" font-size="14">Tempo estimado</text><text x="200" y="255" class="txt" font-size="14">8 h</text><text x="40" y="290" class="txt" font-size="14">Valor da hora</text><text x="185" y="290" class="txt" font-size="14">R$120</text><text x="40" y="325" class="txt" font-size="14">Urgência</text><text x="195" y="325" class="txt" font-size="14">+20%</text><text x="40" y="370" class="txt" font-size="18" font-weight="700">Total</text><text x="165" y="370" class="txt" font-size="18" font-weight="700">R$1.152</text></g>
</g>
</svg>
